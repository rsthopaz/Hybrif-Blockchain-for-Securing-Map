<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Georeferencing Kelapa Sawit Dataset</title>
  <style>
    body {
      background: #f5f7f9;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #2b4d3b;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 10px;
      margin: 20px;
    }
    img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Georeferencing Kelapa Sawit Dataset</h1>
  <p>Lokasi: Kharj & Sultan University</p>

  <div class="gallery">
    <img src="ipfs://QmImage1" alt="Kharj Drone Image 1">
    <img src="ipfs://QmImage2" alt="Kharj Drone Image 2">
    <img src="ipfs://QmImage3" alt="Sultan University Image 1">
  </div>

  <p>📍 Semua citra diambil menggunakan DJI Phantom 4 Pro dan DJI Mavic Pro.</p>
</body>
</html>
